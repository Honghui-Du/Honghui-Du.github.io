{% if page.detail_page %}
<meta name="citation_title" content="{{ page.title | escape }}">
{% for author in page.author_list %}<meta name="citation_author" content="{{ author | escape }}">
{% endfor %}
<meta name="citation_publication_date" content="{{ page.publication_year }}">
<meta name="citation_journal_title" content="{{ page.journal | escape }}">
<meta name="citation_volume" content="{{ page.volume | escape }}">
<meta name="citation_firstpage" content="{{ page.pages | split: '–' | first }}">
{% if page.pages contains '–' %}<meta name="citation_lastpage" content="{{ page.pages | split: '–' | last }}">{% endif %}
<meta name="citation_doi" content="{{ page.doi }}">
<meta name="citation_abstract_html_url" content="{{ page.url | absolute_url }}">
{% if page.pdf %}<meta name="citation_pdf_url" content="{{ page.pdf }}">{% endif %}
<meta name="keywords" content="{{ page.keywords | join: ', ' | escape }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ScholarlyArticle",
  "@id": {{ page.paper_url | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "headline": {{ page.title | jsonify }},
  "name": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "abstract": {{ page.abstract | jsonify }},
  "datePublished": {{ page.publication_year | append: '' | jsonify }},
  "identifier": {"@type": "PropertyValue", "propertyID": "DOI", "value": {{ page.doi | jsonify }}},
  "author": [{% for author in page.author_list %}{"@type": "Person", "name": {{ author | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}],
  "isPartOf": {"@type": "PublicationVolume", "volumeNumber": {{ page.volume | jsonify }}, "isPartOf": {"@type": "Periodical", "name": {{ page.journal | jsonify }}}},
  "pagination": {{ page.pages | jsonify }},
  "keywords": {{ page.keywords | jsonify }},
  "sameAs": {{ page.paper_url | jsonify }}
}
</script>
{% endif %}
